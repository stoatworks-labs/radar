  <body>
    <main id="demo">
      <noscript>
        <h1>Radar</h1>
        <p>
          An FFGL source that's a radar watching a synthetic sea, and an effect
          that makes your clip the sea. A plan-position indicator is a CRT whose
          trace runs out from the centre along the antenna's bearing as the
          antenna turns, painting every echo onto a long-persistence phosphor.
          Nothing here is a drawing of a radar. A reflectivity field goes
          through a radar model, so targets paint arcs as wide as the beam and
          streaks as long as the pulse, the sweep leaves a fading trail, near
          returns are huge until STC flattens them, clutter crowds the centre,
          coasts facing the radar are bright edges with shadow behind them, and
          moving contacts leave a plot of their track.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its sweep timing in
          your browser, so it needs JavaScript and WebGL2. The plugin itself,
          its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/radar">its repository</a>.
        </p>
